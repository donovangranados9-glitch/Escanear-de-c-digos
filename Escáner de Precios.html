<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Escáner de Precios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
/* Layout: una columna tipo etiqueta de góndola; arriba el escaneo, abajo el registro */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#1d2320; --muted:#5f6a64; --line:#d9ddd8;
  --tag:#ffd83d; --tag-ink:#1d2320;
  --up:#c8321f; --up-bg:#fbe4e0; --down:#1f7a45; --down-bg:#dcf1e3;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141816; --surface:#1d2320; --ink:#eef1ee; --muted:#9aa59f; --line:#2f3733;
  --tag:#f2cc2e; --tag-ink:#141816;
  --up:#ff7a66; --up-bg:#3a1f1a; --down:#5fd08d; --down-bg:#17331f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --surface:#1d2320; --ink:#eef1ee; --muted:#9aa59f; --line:#2f3733;
  --tag:#f2cc2e; --tag-ink:#141816;
  --up:#ff7a66; --up-bg:#3a1f1a; --down:#5fd08d; --down-bg:#17331f; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:2.1rem;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:4px 0 0}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* Tarjeta tipo tiquete */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ticket-top{background:var(--tag);color:var(--tag-ink);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ticket-top .label{color:var(--tag-ink);opacity:.75}
.scan-row{display:flex;gap:8px;flex-wrap:wrap}
.scan-btn{flex:1 1 180px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--tag-ink);color:var(--tag);border:0;border-radius:4px;padding:14px;font-family:var(--f-display);font-size:1.3rem;font-weight:700;letter-spacing:.03em;cursor:pointer}
.scan-btn svg{width:26px;height:20px}
.scan-btn.alt{background:transparent;color:var(--tag-ink);border:2px solid var(--tag-ink);font-size:1.1rem}
.file-hide{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.ticket-top{position:relative}
.scan-row:focus-within .scan-btn{outline:none}
.code-input{flex:1 1 180px;min-width:0;font-family:var(--f-mono);font-size:1.05rem;padding:12px;border:2px solid var(--tag-ink);border-radius:4px;background:#fffbe6;color:#1d2320}
.status{font-size:.85rem;min-height:1.2em;margin:0}
.ticket-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:100%}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.money{position:relative}
.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.money input{padding-left:28px;font-family:var(--f-display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.hint{font-size:.8rem;color:var(--muted);margin:0}

/* Resultado */
.result{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:4px;background:var(--bg);flex-wrap:wrap}
.result .big{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.result.up{background:var(--up-bg)} .result.up .big,.result.up .pct{color:var(--up)}
.result.down{background:var(--down-bg)} .result.down .big,.result.down .pct{color:var(--down)}
.pct{font-weight:600;font-variant-numeric:tabular-nums}
.formula{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.primary{flex:1;background:var(--ink);color:var(--bg);border:0;border-radius:4px;padding:12px 16px;font-weight:600}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:10px 14px;font-weight:500}
button:focus-visible,input:focus-visible{outline:3px solid var(--tag);outline-offset:2px}

/* Registro */
.log-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h2{font-family:var(--f-display);font-weight:700;font-size:1.5rem;margin:0}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px}
.tot b{display:block;font-family:var(--f-display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.item .name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .meta{grid-column:1;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.item .meta code{font-family:var(--f-mono)}
.diff{grid-row:1 / span 2;grid-column:2;text-align:right;font-family:var(--f-display);font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums}
.diff small{display:block;font-family:var(--f-body);font-size:.75rem;font-weight:600}
.diff.up{color:var(--up)} .diff.down{color:var(--down)}
.chip{display:inline-block;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;background:var(--tag);color:var(--tag-ink);padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:middle}
.del{background:none;border:0;color:var(--muted);font-size:.8rem;padding:0;text-decoration:underline}
.empty{color:var(--muted);padding:16px 0;margin:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.preview{max-width:100%;max-height:140px;border-radius:4px;display:block}
@media (prefers-reduced-motion:no-preference){.result{transition:background .2s}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Escáner de Precios</h1>
      <p class="sub">Escaneá el tiquete, anotá los dos precios y ves cuánto cambió.</p>
    </div>
  </header>

  <section class="ticket" aria-label="Escanear producto">
    <div class="ticket-top">
      <span class="label">Código de barras</span>
      <div class="scan-row">
        <label class="scan-btn" for="photo">
          <svg viewBox="0 0 26 20" aria-hidden="true"><g fill="currentColor"><rect x="0" y="0" width="2" height="20"/><rect x="4" y="0" width="1" height="20"/><rect x="7" y="0" width="3" height="20"/><rect x="12" y="0" width="1" height="20"/><rect x="15" y="0" width="2" height="20"/><rect x="19" y="0" width="1" height="20"/><rect x="22" y="0" width="1" height="20"/><rect x="24" y="0" width="2" height="20"/></g></svg>
          Tomar foto del código
        </label>
        <label class="scan-btn alt" for="photo2">Elegir de la galería</label>
        <input id="code" class="code-input" inputmode="numeric" autocomplete="off" placeholder="o digitá el código" aria-label="Código de barras">
      </div>
      <input id="photo" class="file-hide" type="file" accept="image/*" capture="environment">
      <input id="photo2" class="file-hide" type="file" accept="image/*">
      <p class="status" id="status" role="status">Toma una foto del código; también sirve un lector USB o Bluetooth.</p>
      <img id="preview" class="preview" alt="Foto del tiquete escaneado" hidden>
    </div>

    <form class="ticket-body" id="form" autocomplete="off">
      <div class="field">
        <label class="label" for="name">Producto (opcional)</label>
        <input id="name" placeholder="Ej. Arroz Tío Pelón 1 kg">
      </div>
      <div class="prices">
        <div class="field">
          <label class="label" for="before">Precio antes</label>
          <div class="money"><span>₡</span><input id="before" inputmode="decimal" placeholder="0"></div>
        </div>
        <div class="field">
          <label class="label" for="now">Precio actual</label>
          <div class="money"><span>₡</span><input id="now" inputmode="decimal" placeholder="0"></div>
        </div>
      </div>
      <p class="hint" id="memHint" hidden></p>

      <div class="result" id="result" aria-live="polite">
        <div>
          <span class="label">Actual − antes</span>
          <div class="big" id="diffBig">₡0</div>
        </div>
        <div style="text-align:right">
          <div class="pct" id="diffPct">Sin datos</div>
          <div class="formula" id="formula">— − —</div>
        </div>
      </div>

      <div class="actions">
        <button class="primary" type="submit" id="saveBtn">Guardar en el registro</button>
        <button class="ghost" type="button" id="clearBtn">Limpiar</button>
      </div>
    </form>
  </section>

  <section aria-labelledby="logTitle" style="display:flex;flex-direction:column;gap:12px">
    <div class="log-head">
      <h2 id="logTitle">Registro</h2>
      <div class="actions">
        <button class="ghost" type="button" id="copyBtn">Copiar para Excel</button>
        <button class="ghost" type="button" id="wipeBtn">Borrar todo</button>
      </div>
    </div>
    <div class="confirm" id="wipeConfirm" hidden>
      ¿Borrar todo el registro?
      <button class="ghost" type="button" id="wipeYes">Sí, borrar</button>
      <button class="ghost" type="button" id="wipeNo">Cancelar</button>
    </div>
    <div class="totals">
      <div class="tot"><span class="label">Productos</span><b id="tCount">0</b></div>
      <div class="tot"><span class="label">Subieron</span><b id="tUp" style="color:var(--up)">0</b></div>
      <div class="tot"><span class="label">Bajaron</span><b id="tDown" style="color:var(--down)">0</b></div>
    </div>
    <div class="list" id="list"></div>
  </section>
</div>

<script>
(function(){
  const KEY = 'escaner-precios-v1';
  const $ = id => document.getElementById(id);
  const fmt = new Intl.NumberFormat('es-CR',{maximumFractionDigits:2});
  const money = n => (n<0?'−':'')+'₡'+fmt.format(Math.abs(n));
  const signed = n => (n>0?'+':n<0?'−':'')+'₡'+fmt.format(Math.abs(n));

  // Ejemplos visibles solo la primera vez (marcados como "ejemplo")
  const EXAMPLES = [
    {id:'e1',code:'7441029500012',name:'Leche entera 1 L',before:950,now:1025,ts:Date.now()-3600e3,ex:true},
    {id:'e2',code:'7441001603217',name:'Café molido 500 g',before:3890,now:3490,ts:Date.now()-7200e3,ex:true},
    {id:'e3',code:'7501055363056',name:'Atún en agua 140 g',before:1150,now:1150,ts:Date.now()-9000e3,ex:true}
  ];

  let items;
  try { const raw = localStorage.getItem(KEY); items = raw ? JSON.parse(raw) : EXAMPLES.slice(); }
  catch(e){ items = EXAMPLES.slice(); }
  const persist = () => { try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){} };

  // Convierte "1.250,50" / "1250.5" / "1 250" a número
  function parsePrice(s){
    s = String(s||'').replace(/[₡\s]/g,'');
    if(!s) return NaN;
    if(s.includes(',') && s.includes('.')) s = s.lastIndexOf(',')>s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
    else if(s.includes(',')) s = /,\d{3}$/.test(s) ? s.replace(/,/g,'') : s.replace(',','.');
    else if(/\.\d{3}$/.test(s)) s = s.replace(/\./g,'');
    return parseFloat(s);
  }

  // ---- Cálculo en vivo ----
  function calc(){
    const b = parsePrice($('before').value), n = parsePrice($('now').value);
    const box = $('result'); box.classList.remove('up','down');
    if(isNaN(b) || isNaN(n)){ $('diffBig').textContent='₡0'; $('diffPct').textContent='Sin datos'; $('formula').textContent='— − —'; return null; }
    const d = Math.round((n-b)*100)/100;
    $('diffBig').textContent = signed(d);
    $('formula').textContent = money(n)+' − '+money(b);
    if(d>0){ box.classList.add('up'); $('diffPct').textContent = 'Subió '+(b?fmt.format(d/b*100)+' %':''); }
    else if(d<0){ box.classList.add('down'); $('diffPct').textContent = 'Bajó '+(b?fmt.format(Math.abs(d)/b*100)+' %':''); }
    else $('diffPct').textContent = 'Sin cambio';
    return {b,n,d};
  }
  ['before','now'].forEach(id => $(id).addEventListener('input', calc));

  // ---- Al tener un código: recordar lo último guardado de ese producto ----
  function onCode(code){
    code = String(code||'').trim();
    $('code').value = code;
    if(!code) return;
    const last = items.filter(i => i.code===code && !i.ex).sort((a,b)=>b.ts-a.ts)[0];
    if(last){
      $('before').value = last.now; if(!$('name').value) $('name').value = last.name||'';
      $('memHint').hidden = false;
      $('memHint').textContent = 'Ya lo habías registrado: el "precio antes" se llenó con el último precio guardado ('+money(last.now)+').';
    } else $('memHint').hidden = true;
    calc();
    $(last ? 'now' : 'before').focus();
  }
  $('code').addEventListener('change', e => onCode(e.target.value));
  $('code').addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); onCode(e.target.value); } });

  // ---- Escaneo desde foto ----
  const status = t => $('status').textContent = t;
  ['photo','photo2'].forEach(id => $(id).addEventListener('change', handlePhoto));
  async function handlePhoto(e){
    const file = e.target.files && e.target.files[0]; e.target.value='';
    if(!file) return;
    const url = URL.createObjectURL(file);
    $('preview').src = url; $('preview').hidden = false;
    status('Leyendo el código…');
    try{
      const code = await decode(url, file);
      status('Código leído: '+code); onCode(code);
    }catch(err){
      status('No encontré un código en la foto. Acercá el teléfono, que el código salga derecho y con buena luz, o digitalo a mano.');
    }
  }

  async function decode(url, file){
    // 1) API nativa del navegador si existe (Chrome Android)
    if('BarcodeDetector' in window){
      try{
        const det = new BarcodeDetector();
        const bmp = await createImageBitmap(file);
        const r = await det.detect(bmp);
        if(r.length) return r[0].rawValue;
      }catch(e){}
    }
    // 2) ZXing como respaldo
    if(!window.ZXing) throw new Error('sin lector');
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    const reader = new ZXing.BrowserMultiFormatReader(hints);
    const res = await reader.decodeFromImageUrl(url);
    return res.getText();
  }

  // ---- Guardar / limpiar ----
  function clearForm(){
    ['code','name','before','now'].forEach(id => $(id).value='');
    $('memHint').hidden = true; $('preview').hidden = true; calc();
    status('Listo para el siguiente tiquete.');
  }
  $('clearBtn').addEventListener('click', clearForm);
  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const r = calc();
    if(!r){ status('Falta el precio de antes o el actual.'); return; }
    items = items.filter(i => !i.ex); // al guardar el primero real, se van los ejemplos
    items.unshift({id:Date.now().toString(36), code:$('code').value.trim(), name:$('name').value.trim(), before:r.b, now:r.n, ts:Date.now()});
    persist(); render(); clearForm(); status('Guardado. Escaneá el siguiente.');
  });

  // ---- Registro ----
  function render(){
    const list = $('list'); list.textContent='';
    const real = items;
    $('tCount').textContent = real.length;
    $('tUp').textContent = real.filter(i=>i.now>i.before).length;
    $('tDown').textContent = real.filter(i=>i.now<i.before).length;
    if(!real.length){ const p=document.createElement('p'); p.className='empty'; p.textContent='Todavía no hay productos. Escaneá el primero arriba.'; list.append(p); return; }
    real.forEach(i => {
      const d = Math.round((i.now-i.before)*100)/100;
      const row = document.createElement('div'); row.className='item';
      const name = document.createElement('div'); name.className='name';
      name.textContent = i.name || 'Sin nombre';
      if(i.ex){ const c=document.createElement('span'); c.className='chip'; c.textContent='ejemplo'; name.append(c); }
      const diff = document.createElement('div'); diff.className='diff '+(d>0?'up':d<0?'down':'');
      diff.textContent = signed(d);
      const sm = document.createElement('small'); sm.textContent = d===0?'igual':(i.before?fmt.format(d/i.before*100)+' %':''); diff.append(sm);
      const meta = document.createElement('div'); meta.className='meta';
      const code = document.createElement('code'); code.textContent = i.code || 'sin código';
      meta.append(code, document.createTextNode(' · '+money(i.before)+' → '+money(i.now)+' · '));
      const del = document.createElement('button'); del.className='del'; del.type='button'; del.textContent='quitar';
      del.addEventListener('click', () => { items = items.filter(x=>x.id!==i.id); persist(); render(); });
      meta.append(del);
      row.append(name, diff, meta); list.append(row);
    });
  }

  // Copiar como tabla (se pega directo en Excel)
  $('copyBtn').addEventListener('click', () => {
    const rows = [['Código','Producto','Precio antes','Precio actual','Diferencia (actual − antes)','% cambio','Fecha']]
      .concat(items.map(i => [i.code, i.name, i.before, i.now, Math.round((i.now-i.before)*100)/100,
        i.before? (Math.round((i.now-i.before)/i.before*10000)/100):'', new Date(i.ts).toLocaleString('es-CR')]));
    const tsv = rows.map(r => r.join('\t')).join('\n');
    const done = () => status('Registro copiado. Pegalo en Excel con Ctrl+V.');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(tsv).then(done).catch(() => fallbackCopy(tsv, done));
    } else fallbackCopy(tsv, done);
  });
  function fallbackCopy(text, done){
    const ta = document.createElement('textarea'); ta.value=text; document.body.append(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ status('No se pudo copiar automáticamente.'); }
    ta.remove();
  }

  $('wipeBtn').addEventListener('click', () => $('wipeConfirm').hidden = false);
  $('wipeNo').addEventListener('click', () => $('wipeConfirm').hidden = true);
  $('wipeYes').addEventListener('click', () => { items=[]; persist(); render(); $('wipeConfirm').hidden = true; status('Registro borrado.'); });

  render(); calc();
})();
</script>

</body></html>
